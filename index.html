<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pedra, Papel e Tesoura</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="asset-test">
      <section class="asset-group" aria-label="Elementos do jogo">
        <figure class="asset-card">
          <img class="game-asset" src="assets/pedra.png" alt="Pedra" />

          <figcaption>Pedra</figcaption>
        </figure>

        <figure class="asset-card">
          <img class="game-asset" src="assets/papel.png" alt="Papel" />

          <figcaption>Papel</figcaption>
        </figure>

        <figure class="asset-card">
          <img class="game-asset" src="assets/tesoura.png" alt="Tesoura" />

          <figcaption>Tesoura</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
