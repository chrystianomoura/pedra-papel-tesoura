<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pedra, Papel e Tesoura</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="jogo">
      <!-- ==========================
           CABEÇALHO DO JOGO
      =========================== -->

      <header class="cabecalho">
        <h1 class="titulo">
          Pedra, Papel
          <span>e Tesoura</span>
        </h1>

        <div class="linha-rodada">
          <p class="rodada">Rodada 01</p>
        </div>
      </header>

      <!-- ==========================
           MENSAGEM DO JOGO
      =========================== -->

      <div class="area-mensagem">
        <p class="mensagem-jogo">Escolha sua jogada:</p>

        <div class="separador" aria-hidden="true">
          <span class="losango"></span>
        </div>
      </div>

      <!-- ==========================
           OPÇÕES DE JOGADA
      =========================== -->

      <section class="elementos" aria-label="Escolha Pedra, Papel ou Tesoura">
        <!-- Pedra -->
        <button
          class="elemento elemento--pedra"
          type="button"
          aria-label="Escolher Pedra"
        >
          <img class="imagem-elemento" src="assets/pedra.png" alt="" />
        </button>

        <!-- Papel -->
        <button
          class="elemento elemento--papel"
          type="button"
          aria-label="Escolher Papel"
        >
          <img class="imagem-elemento" src="assets/papel.png" alt="" />
        </button>

        <!-- Tesoura -->
        <button
          class="elemento elemento--tesoura"
          type="button"
          aria-label="Escolher Tesoura"
        >
          <img class="imagem-elemento" src="assets/tesoura.png" alt="" />
        </button>
      </section>

      <!-- ==========================
           PLACAR
      =========================== -->

      <footer class="placar" aria-label="Placar da partida">
        <span class="placar-jogador">Você</span>

        <strong class="placar-pontos">0 : 0</strong>

        <span class="placar-cpu">CPU</span>
      </footer>
    </main>
  </body>
</html>
