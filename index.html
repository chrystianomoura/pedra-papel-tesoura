<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pedra, Papel e Tesoura</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="jogo">
      <!-- ==========================
           CABEÇALHO DO JOGO
      =========================== -->

      <header class="cabecalho">
        <h1 class="titulo">
          Pedra, Papel
          <span>e Tesoura</span>
        </h1>

        <p class="rodada">Rodada 01</p>
      </header>

      <!-- ==========================
           OPÇÕES DE JOGADA
      =========================== -->

      <section class="elementos" aria-label="Escolha Pedra, Papel ou Tesoura">
        <!-- Pedra -->
        <button
          class="elemento elemento--pedra"
          type="button"
          aria-label="Escolher Pedra"
        >
          <img
            class="imagem-elemento"
            src="assets/pedra.png"
            alt=""
          />
        </button>

        <!-- Papel -->
        <button
          class="elemento elemento--papel"
          type="button"
          aria-label="Escolher Papel"
        >
          <img
            class="imagem-elemento"
            src="assets/papel.png"
            alt=""
          />
        </button>

        <!-- Tesoura -->
        <button
          class="elemento elemento--tesoura"
          type="button"
          aria-label="Escolher Tesoura"
        >
          <img
            class="imagem-elemento"
            src="assets/tesoura.png"
            alt=""
          />
        </button>
      </section>
    </main>
  </body>
</html>
